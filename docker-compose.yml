version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: drift_sentinel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hospital_drift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: drift_sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hospital_drift
      - SECRET_KEY=hospital-drift-sentinel-docker-secret-key
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python data/generate_dataset.py &&
             python scripts/seed_database.py &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
